# Asks each new contributor to sign the CLA (CLA.md) in their first pull request, and
# records the signature in the cla-signatures branch. The action never checks out the
# pull request's code, which is what makes pull_request_target safe here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # v2.6.1, pinned to its commit: it can write to the repository.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/kevbesset/Chord/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: kevbesset,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before it can be merged, please read Chord's
            [Contributor License Agreement](https://github.com/kevbesset/Chord/blob/main/CLA.md)
            and sign it by replying with the comment below. You keep the copyright on your
            work; you sign once, for all your contributions.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
