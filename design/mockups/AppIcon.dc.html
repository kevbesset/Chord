<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chord — app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#3B4A6B}a:hover{color:#1F2A44}
</style>
</helmet>
<div style="width: 1440px; height: 560px; box-sizing: border-box; padding: 48px 56px; background: #F4F4F6; color: #1C1C1E; display: flex; align-items: center; gap: 64px">

  <!-- Main icon, 1024 rendered at 400 -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
    <div style="width: 400px; height: 400px; border-radius: 22.37%; background: {{bg}}; box-shadow: 0 24px 50px rgba(20,24,70,0.30), 0 2px 6px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center">
      <svg role="img" aria-label="Chord icon: a white arc closed by a colored chord" width="248" height="248" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round">
        <path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke="#FFFFFF" stroke-width="30"></path>
        <path d="M70.7,70.7 L70.7,-70.7" stroke="{{accent}}" stroke-width="30"></path>
      </svg>
    </div>
    <span style="font-size: 13px; color: #6E6E73">1024 px · plain background, no gradient</span>
  </div>

  <!-- Variations -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 34px">

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 700; color: #8E8E93; letter-spacing: 0.6px">DOCK AND FINDER SIZES</span>
      <div style="display: flex; align-items: flex-end; gap: 28px">
        <div style="width: 128px; height: 128px; border-radius: 22.37%; background: {{bg}}; box-shadow: 0 8px 18px rgba(20,24,70,0.22); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="80" height="80" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round"><path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke="#FFFFFF" stroke-width="30"></path><path d="M70.7,70.7 L70.7,-70.7" stroke="{{accent}}" stroke-width="30"></path></svg></div>
        <div style="width: 64px; height: 64px; border-radius: 22.37%; background: {{bg}}; box-shadow: 0 4px 10px rgba(20,24,70,0.22); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="40" height="40" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round"><path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke="#FFFFFF" stroke-width="32"></path><path d="M70.7,70.7 L70.7,-70.7" stroke="{{accent}}" stroke-width="32"></path></svg></div>
        <div style="width: 32px; height: 32px; border-radius: 22.37%; background: {{bg}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round"><path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke="#FFFFFF" stroke-width="36"></path><path d="M70.7,70.7 L70.7,-70.7" stroke="{{accent}}" stroke-width="36"></path></svg></div>
        <div style="width: 16px; height: 16px; border-radius: 22.37%; background: {{bg}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round"><path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke="#FFFFFF" stroke-width="44"></path><path d="M70.7,70.7 L70.7,-70.7" stroke="{{accent}}" stroke-width="44"></path></svg></div>
        <span style="font-size: 12px; color: #8E8E93; padding-bottom: 2px">128 · 64 · 32 · 16 — the stroke gets thicker at small sizes</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 700; color: #8E8E93; letter-spacing: 0.6px">MENU BAR AND MONOCHROME GLYPH</span>
      <div style="display: flex; align-items: center; gap: 28px">
        <div style="display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px; border-radius: 6px; background: rgba(255,255,255,0.9); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); font-size: 13px; color: #1C1C1E">
          <svg aria-hidden="true" width="16" height="16" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round" stroke="#1C1C1E"><path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke-width="34"></path><path d="M70.7,70.7 L70.7,-70.7" stroke-width="34"></path></svg>
          <span style="font-weight: 600">Chord</span><span>File</span><span>Edit</span>
        </div>
        <div style="display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px; border-radius: 6px; background: #1C1C1E; font-size: 13px; color: #F2F2F7">
          <svg aria-hidden="true" width="16" height="16" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round" stroke="#F2F2F7"><path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke-width="34"></path><path d="M70.7,70.7 L70.7,-70.7" stroke-width="34"></path></svg>
          <span style="font-weight: 600">Chord</span><span>File</span><span>Edit</span>
        </div>
        <span style="font-size: 12px; color: #8E8E93">One stroke, one color: the glyph stays legible without the colored chord</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 700; color: #8E8E93; letter-spacing: 0.6px">IN THE DOCK</span>
      <div style="display: flex; align-items: flex-end; gap: 14px; height: 76px; padding: 0 16px; border-radius: 18px; background: rgba(255,255,255,0.6); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06)">
        <div style="width: 56px; height: 56px; border-radius: 22.37%; background: #2F6FE4; margin-bottom: 10px"></div>
        <div style="width: 56px; height: 56px; border-radius: 22.37%; background: #E6E6EA; margin-bottom: 10px"></div>
        <div style="width: 56px; height: 56px; border-radius: 22.37%; background: {{bg}}; margin-bottom: 10px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="34" viewBox="-120 -120 240 240" fill="none" stroke-linecap="round"><path d="M70.7,-70.7 A100,100 0 1 0 70.7,70.7" stroke="#FFFFFF" stroke-width="32"></path><path d="M70.7,70.7 L70.7,-70.7" stroke="{{accent}}" stroke-width="32"></path></svg></div>
        <div style="width: 56px; height: 56px; border-radius: 22.37%; background: #30D158; margin-bottom: 10px"></div>
        <div style="width: 56px; height: 56px; border-radius: 22.37%; background: #1C1C1E; margin-bottom: 10px"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8FA0FF","options":["#8FA0FF","#5B6CFF","#7CE3B0","#FFB86B"],"section":"Marque"},"bg":{"editor":"color","default":"#1F2452","options":["#1F2452","#14162B","#2B2F7A","#1C1C1E"],"section":"Marque"},"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8FA0FF', bg: this.props.bg ?? '#1F2452' };
  }
}
</script>
</body>
</html>
