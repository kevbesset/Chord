# Xcode project definition. Generate with: xcodegen generate
# Never edit Chord.xcodeproj by hand; it is rebuilt from this file.
#
# Only ChordUI: Chord itself is Chromium with ChordUI loaded into it
# (engine/scripts/build.sh, engine/scripts/run.sh).
name: Chord

options:
  bundleIdPrefix: app.chord
  developmentLanguage: fr
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Local, unsigned development builds. Real signing comes with distribution.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  ChordUI:
    type: framework
    platform: macOS
    sources:
      - path: ChordUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chord.ChordUI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/Frameworks"

schemes:
  ChordUI:
    build:
      targets:
        ChordUI: all
