# Xcode project definition. Generate with: xcodegen generate
# Never edit Chord.xcodeproj by hand; it is rebuilt from this file.
#
# Only ChordUI: Chord itself is Chromium with ChordUI loaded into it
# (engine/scripts/build.sh, engine/scripts/run.sh). The Chord scheme launches it.
name: Chord

options:
  bundleIdPrefix: app.chord
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # The interface's languages live in ChordUI/Localizable.xcstrings; building
    # extracts every String(localized:) into it.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Local, unsigned development builds. Real signing comes with distribution.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  # Chord's own updates (SUFeedURL and SUPublicEDKey are set in release builds by
  # engine/scripts/package.sh). Its framework goes into Chord.app next to ChordUI.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4

targets:
  ChordUI:
    type: framework
    platform: macOS
    sources:
      - path: ChordUI
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chord.ChordUI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/Frameworks"

schemes:
  # Build (⌘B) or Run (⌘R): compiles ChordUI, puts it in Chord.app and relaunches
  # Chord. Chord.app must have been built once with engine/scripts/build.sh.
  Chord:
    build:
      targets:
        ChordUI: all
      postActions:
        - name: Launch Chord
          settingsTarget: ChordUI
          script: |
            mkdir -p "$PROJECT_DIR/build"
            "$PROJECT_DIR/../engine/scripts/run.sh" --framework "$BUILT_PRODUCTS_DIR/ChordUI.framework" > "$PROJECT_DIR/build/run-chord.log" 2>&1
    run:
      config: Debug
